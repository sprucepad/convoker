name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22.23.4

      - name: Publish
        run: pnpm -r publish --no-git-checks --provenance
